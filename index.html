<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <title>Classify · OldVisOnline</title>
    <meta name="description" content="Label classification for historical visualization images" />
  </head>
  <body class="font-sans dark:text-gray-300 dark:bg-hex-121212">
    <div id="app"></div>
    <noscript>
      <div>Please enable JavaScript to use this application.</div>
    </noscript>
    <script>
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'dark' || (prefersDark && setting !== 'light')) {
          document.documentElement.classList.toggle('dark', true)
        }
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
